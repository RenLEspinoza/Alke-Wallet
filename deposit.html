<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="menu.html">← Volver al menu</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                
                <div class="card shadow-sm p-4 rounded-3">
                    <h3 class="fw-bold mb-3 text-center">Deposito </h3>
                    <p class="text-muted text-center small mb-4">Agrega dinero a tu billetera de forma rapida y segura.</p>
                    
                    <div class="alert alert-secondary text-center mb-4">
                        <span class="d-block small text-uppercase text-muted fw-bold">Saldo antes del depósito</span>
                        <span class="fs-3 fw-bold text-dark">$<span id="txt-saldo">150000</span></span>
                    </div>

                    <div id="form-deposito">
                        
                        <div class="mb-4">
                            <label for="monto-deposito" class="form-label fw-bold">Monto a depositar</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="monto-deposito" placeholder="Ej: 20000" min="1">
                            </div>
                            <div class="form-text text-muted">
                                El depósito mínimo permitido es de $1.000.
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" id="btn-realizar-deposito" class="btn btn-success btn-lg">
                                ➕ Realizar Depósito
                            </button>
                            <a href="menu.html" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </div>
                    </div>
                
            </div>
        </div>
    </div>
      

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>

</body>
</html>
