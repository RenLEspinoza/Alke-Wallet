<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

   <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">Alke Wallet</a>

                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

            <div class="collapse navbar-collapse" id="navbarNav">
            
                    <!-- <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link btn btn-link text-white text-left text-lg-center w-100 mb-3 mb-lg-0" href="/menu.html">Menú</a>
                        </li>
                    </ul> -->

                    <ul class="navbar-nav ml-auto text-lg-right">
                        <li class="mt-2 mt-lg-0">
                            <a class="btn btn-outline-light px-4 w-100 d-lg-inline-block" href="index.html">Volver</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Crear Cuenta</h4>
                    </div>
                    <div class="card-body">
                        
                        <form id="formulario-registro">
                            <div class="form-group">
                                <label for="nombre">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre-registro" placeholder="Ingresa tu nombre" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email-registro" placeholder="ejemplo@correo.com" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password-registro" placeholder="Mínimo 6 caracteres" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirm-password-registro" placeholder="Mínimo 6 caracteres" required>
                            </div>

                            <div class="form-group form-check">
                                <input type="checkbox" class="form-check-input" id="terminos-registro" required>
                                <label class="form-check-label" for="terminos">Acepto los términos y condiciones</label>
                            </div>

                            <button type="submit" id="btn-registrar" class="btn btn-primary btn-block">Registrarse</button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>


        <!-- Footer -->
    <footer class="bg-dark text-muted py-4 text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Alke Wallet. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="js/registro.js"></script>
</body>
</html>
