<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navbar de pagina Menu -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Alke Wallet</a>
            
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <div class="row">
            
            <div class="col-12 col-md-4 mb-4">

    <!-- Card de Saldo disponible -->

                <div class="card bg-dark text-white p-4 mb-3 border-0 shadow-sm">
                    <small class="text-secondary text-uppercase fw-bold">Saldo Disponible</small>
                    <h2 id="saldoActual" class="display-6 my-2 fw-bold">$150.000</h2>
                    <small class="text-muted">Cuenta N° ****4321</small>
                </div>

    <!-- Card de acciones: Transferir / Realizar deposito / Retiro de fondos -->

                <div class="card p-3 shadow-sm">
                    <h6 class="mb-3 fw-bold text-muted">Acciones</h6>
                    <div class="d-grid gap-2">
                        <a href="sendmoney.html" class="btn btn-primary id-btn-enviar">
                                💸 Transferir
                        </a>
                        <a href="deposit.html" class="btn btn-outline-primary id-btn-recargar">
                                ➕ Realizar deposito
                        </a>
                        <button class="btn btn-outline-secondary id-btn-pagar" type="button">
                                📄 Retiro de fondos
                        </button>
                    </div>
                </div>

            </div>

    <!-- Card de ultimos movimientos / historial -->

            <div class="col-12 col-md-8 mb-4">
                
                <div class="card p-4 shadow-sm">
                    <h5 class="mb-4 fw-bold">Últimos Movimientos</h5>
                    
                    <div class="list-group list-group-flush">
                        
                        <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            <div>
                                <h6 class="mb-0 fw-bold">Transferencia enviada a Juan</h6>
                                <small class="text-muted">Hoy, 14:30</small>
                            </div>
                            <span class="text-danger fw-bold">-$15.000</span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            <div>
                                <h6 class="mb-0 fw-bold">Depósito recibido</h6>
                                <small class="text-muted">Ayer, 09:15</small>
                            </div>
                            <span class="text-success fw-bold">+$50.000</span>
                        </div>

                        <div class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            <div>
                                <h6 class="mb-0 fw-bold">Pago de cuenta Luz</h6>
                                <small class="text-muted">20 de Junio, 18:00</small>
                            </div>
                            <span class="text-danger fw-bold">-$22.450</span>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>


















    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>

</body>
</html>
