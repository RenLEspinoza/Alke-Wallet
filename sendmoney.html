<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero - Alke Wallet</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Alke Wallet</a>

                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

            <div class="collapse navbar-collapse" id="navbarNav">
            
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link btn btn-link text-white text-left text-lg-center w-100 mb-3 mb-lg-0" href="/menu.html">Menú</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ml-auto text-lg-right">
                        <li class="mt-2 mt-lg-0">
                            <a class="btn btn-outline-light px-4 w-100 d-lg-inline-block" href="index.html">Cerrar sesión</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

  <main class="container mt-5">
    <div class="row">
      
      <section class="col-md-8">
        <div class="card p-4 shadow-sm">
          <h2 class="h4 mb-4">Enviar Dinero</h2>
          
          <form>
            <div class="form-group">
              <label for="contacto">Seleccionar Contacto</label>
              <select class="form-control" id="contacto" required>
                <option value="" disabled selected>Escoge un destinatario...</option>
                <option value="1">Juan Pérez</option>
                <option value="2">María López</option>
              </select>
            </div>

            <div class="form-group">
              <label for="monto">Monto a Enviar</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">$</span>
                </div>
                <input type="number" class="form-control" id="monto" min="1" step="1" placeholder="Ej: 5000" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success">Confirmar Envío</button>
          </form>
        </div>
      </section>

      <aside class="col-md-4 mt-4 mt-md-0">
        <div class="card p-3 bg-light">
          <h3 class="h5 mb-3">Mis Contactos</h3>
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Juan Pérez <span class="badge badge-secondary">Frecuente</span>
            </li>
            <li class="list-group-item">María López</li>
            <li class="list-group-item">Carlos Muñoz</li>
          </ul>
        </div>
      </aside>

    </div>
  </main>

    <!-- Footer -->
    <footer class="bg-dark text-muted py-4 text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Alke Wallet. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
</body>
</html>
