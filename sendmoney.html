<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero - Alke Wallet</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <script>
        // Prevenir acceso manual sin login a pantallas criticas.
        if (!localStorage.getItem('usuarioActual')) {
            window.location.replace('index.html'); 
        }
    </script>
</head>
<body>

     <!-- Navbar de sendmoney.html -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/index.html">Alke Wallet</a>

                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

            <div class="collapse navbar-collapse" id="navbarNav">
            
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link btn btn-link text-white text-left text-lg-center w-100 mb-3 mb-lg-0" href="/menu.html">Menú</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ml-auto text-lg-right">
                        <li class="mt-2 mt-lg-0">
                            <a id= "btn-logout" class="btn btn-outline-light px-4 w-100 d-lg-inline-block" href="index.html">Cerrar sesión</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

  
  <main class="container mt-5">

    <!-- Formulario para enviar dinero -->
    <div class="row">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-4">Enviar Dinero</h3>
            <p class="text-muted">Saldo disponible: <strong id="saldo-disponible"></strong></p>
            
            <div class="form-group">
                <label for="buscarContacto">Seleccionar Contacto</label>
                <input type="text" id="buscarContacto" class="form-control" placeholder="Escribe el nombre del contacto...">
            </div>

            <div class="form-group">
                <label for="montoEnviar">Monto a Enviar</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">$</span>
                    </div>
                    <input type="number" class="form-control" id="montoEnviar" placeholder="Ej: 5000">
                </div>
            </div>

            <button type="button" id="btn-confirmar-envio" class="btn btn-success">Confirmar Envío</button>
            
            <div id="mensaje-alerta" class="alert d-none mt-3" role="alert"></div>
        </div>
    </div>

    <!-- Lista de Contactos -->
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center font-weight-bold">
                <span>Mis Contactos</span>
                <button class="btn btn-sm btn-outline-primary" data-toggle="modal" data-target="#modalContacto">+ Agregar</button>
            </div>
            
            <div class="list-group list-group-flush"  id="listaContactos">
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <h6 class="mb-1 font-weight-bold">Juan Perez</h6>
                    <div><span class="badge badge-secondary">N° Cuenta: 25455212</span></div>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <h6 class="mb-1 font-weight-bold">Maria Pino</h6>
                    <div><span class="badge badge-secondary">N° Cuenta: 27194466</span></div>
                </div>
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <h6 class="mb-1 font-weight-bold">Carla Lobos</h6>
                    <div><span class="badge badge-secondary">N° Cuenta: 22295447</span></div>
                </div>
               
            </div>
        </div>
    </div>
</div>

<!-- Modal agregar contacto -->
<div class="modal fade" id="modalContacto" tabindex="-1" role="dialog" aria-labelledby="modalContactoLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalContactoLabel">Agregar Nuevo Contacto</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="nombreContacto">Nombre Completo</label>
          <input type="text" class="form-control" id="nombreContacto" placeholder="Ej: Jeon Jung-kook">
        </div>
        <div class="form-group">
          <label for="rutContacto">Rut</label>
          <input type="text" class="form-control" id="rutContacto" placeholder="Ej: 20.999.999-9">
        </div>
        <div class="form-group">
          <label for="bancoContacto">Banco o Institución</label>
          <input type="text" class="form-control" id="bancoContacto" placeholder="Ej: Alke Wallet Bank">
        </div>
        <div class="form-group">
          <label for="cuentaContacto">Número de Cuenta</label>
          <input type="text" class="form-control" id="cuentaContacto" placeholder="Ej: 123456789">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" id="btn-guardar-contacto" class="btn btn-success">Guardar Contacto</button>
      </div>
    </div>
  </div>
</div>
  </main>

    <!-- Footer -->
    <footer class="bg-dark text-muted py-4 text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Alke Wallet. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="js/auth.js" defer></script>
    <script src="js/sendmoney.js" defer></script>
</body>
</html>
