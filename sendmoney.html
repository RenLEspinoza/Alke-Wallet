        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

            <div class="collapse navbar-collapse" id="navbarNav">
            
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link btn btn-link text-white text-left text-lg-center w-100 mb-3 mb-lg-0" href="/menu.html">Menú</a>
                        </li>
                    </ul>

                    <ul class="navbar-nav ml-auto text-lg-right">
                        <li class="mt-2 mt-lg-0">
                            <a class="btn btn-outline-light px-4 w-100 d-lg-inline-block" href="index.html">Cerrar sesión</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

  <main class="container mt-5">
    <div class="row">
      
      <section class="col-md-8">
        <div class="card p-4 shadow-sm">
          <h2 class="h4 mb-4">Enviar Dinero</h2>
          
          <form>
            <div class="form-group">
              <label for="contacto">Seleccionar Contacto</label>
              <select class="form-control" id="contacto" required>
                <option value="" disabled selected>Escoge un destinatario...</option>
                <option value="1">Juan Pérez</option>
                <option value="2">María López</option>
              </select>
            </div>

            <div class="form-group">
              <label for="monto">Monto a Enviar</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">$</span>
                </div>
                <input type="number" class="form-control" id="monto" min="1" step="1" placeholder="Ej: 5000" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success">Confirmar Envío</button>
          </form>
        </div>
      </section>

      <aside class="col-md-4 mt-4 mt-md-0">
        <div class="card p-3 bg-light">
          <h3 class="h5 mb-3">Mis Contactos</h3>
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Juan Pérez <span class="badge badge-secondary">Frecuente</span>
            </li>
            <li class="list-group-item">María López</li>
            <li class="list-group-item">Carlos Muñoz</li>
          </ul>
        </div>
      </aside>

    </div>
  </main>
