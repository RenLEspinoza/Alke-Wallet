<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="menu.html">← Volver al Menu</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm p-4 rounded-3">
                    <h3 class="fw-bold mb-4 text-center">Enviar Dinero</h3>
                    
                    <div id="alerta-error" class="alert alert-danger d-none" role="alert">
                        </div>

                    <form id="form-transferencia" action="menu.html" method="GET" novalidate>
                        
                        <div class="mb-3">
    <label for="destinatario" class="form-label">Destinatario (Correo o N° de Cuenta)</label>
    <input type="text" class="form-control" id="destinatario" list="lista-contactos" placeholder="ejemplo@correo.com o 123456">
    
    <datalist id="lista-contactos">
        <option value="juan@alke.com">
        <option value="maria@alke.com">
    </datalist>
</div>

<div class="mb-4">
    <label for="nombre-contacto" class="form-label">Nombre del contacto</label>
    <div class="input-group">
        <input type="text" class="form-control" id="nombre-contacto" placeholder="Juan Pérez">
        <button class="btn btn-outline-primary" type="button" id="btn-agregar-contacto">
            💾 Guardar
        </button>
    </div>
</div>

                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto a enviar</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="monto-transferir" placeholder="0" min="1" required>
                                <div class="invalid-feedback">
                                    El monto debe ser mayor a 0.
                                </div>
                            </div>
                            <small class="text-muted d-block mt-1">
                                Saldo disponible: <span class="fw-bold text-dark">$150.000</span>
                            </small>
                        </div>

                        <div class="mb-4">
                            <label for="motivo" class="form-label">Motivo (Opcional)</label>
                            <input type="text" class="form-control" id="motivo" placeholder="Ej: Pago de almuerzo">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                Confirmar Transferencia
                            </button>
                            <a href="menu.html" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>
                    </div>
                
            </div>
        </div>
    </div>









    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>

</body>
</html>
